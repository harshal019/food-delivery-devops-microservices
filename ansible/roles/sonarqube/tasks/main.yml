---
- name: Add ubuntu user to docker group
  user:
    name: ubuntu
    groups: docker
    append: yes

- name: Create Docker volume for SonarQube
  command: docker volume create sonarqube_data
  changed_when: false

- name: Run SonarQube container
  command: docker run -d --name sonarqube -p 9000:9000 -v sonarqube_data:/opt/sonarqube/data sonarqube:latest
  changed_when: false

- name: Wait for SonarQube
  wait_for:
    port: 9000
    delay: 10
    timeout: 120

- name: Display SonarQube info
  debug:
    msg:
      - "✅ SonarQube deployed!"
      - "🔗 URL: http://{{ ansible_host }}:9000"
      - "👤 Username: admin"
      - "🔑 Password: admin"